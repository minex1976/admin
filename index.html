<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin · Winzo Server</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b1a2a;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
            color: #d4e6fa;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 2px solid rgba(60, 120, 170, 0.2);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-header h1 {
            color: #f5e7c8;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }
        .admin-header h1 span {
            color: #f5c542;
        }
        .admin-header .status {
            color: #7ddfa0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-header .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .admin-header .status .dot.online {
            background: #7ddfa0;
            box-shadow: 0 0 10px rgba(125, 223, 160, 0.4);
        }
        .admin-header .status .dot.offline {
            background: #ff6b6b;
            box-shadow: 0 0 10px rgba(255, 80, 80, 0.3);
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }
        .admin-card {
            background: rgba(20, 45, 70, 0.6);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(60, 120, 170, 0.15);
        }
        .admin-card h2 {
            color: #f5e7c8;
            font-size: 1.1rem;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(60, 120, 170, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-card .count {
            color: #8ab0c8;
            font-size: 0.8rem;
            font-weight: 400;
        }

        .transaction-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .transaction-list::-webkit-scrollbar {
            width: 4px;
        }
        .transaction-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .transaction-list::-webkit-scrollbar-thumb {
            background: rgba(80, 150, 200, 0.3);
            border-radius: 10px;
        }
        .tx-item {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-left: 4px solid #f5d76e;
            transition: all 0.3s;
        }
        .tx-item.approved {
            border-left-color: #7ddfa0;
            opacity: 0.7;
        }
        .tx-item.rejected {
            border-left-color: #ff6b6b;
            opacity: 0.7;
        }
        .tx-item .tx-info {
            flex: 1;
            min-width: 140px;
        }
        .tx-item .tx-info .user {
            font-weight: 700;
            color: #f5e7c8;
            font-size: 0.95rem;
        }
        .tx-item .tx-info .details {
            font-size: 0.7rem;
            color: #8ab0c8;
        }
        .tx-item .tx-amount {
            font-weight: 800;
            font-size: 1.1rem;
            color: #f5c542;
            min-width: 60px;
        }
        .tx-item .tx-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: stretch;
        }
        .tx-item .tx-actions .row {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tx-item .tx-actions select {
            background: #0a1a2a;
            border: 1px solid rgba(60, 120, 170, 0.4);
            border-radius: 16px;
            padding: 2px 8px;
            color: #e8f0f8;
            font-size: 0.7rem;
            outline: none;
            max-width: 120px;
        }
        .tx-item .tx-actions select:focus {
            border-color: #f5c542;
        }
        .tx-item .tx-actions input[type="text"] {
            background: #0a1a2a;
            border: 1px solid rgba(60, 120, 170, 0.4);
            border-radius: 16px;
            padding: 2px 8px;
            color: #e8f0f8;
            font-size: 0.7rem;
            outline: none;
            width: 100px;
        }
        .tx-item .tx-actions input[type="text"]:focus {
            border-color: #f5c542;
        }
        .tx-item .tx-actions button {
            padding: 4px 14px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tx-item .tx-actions .approve {
            background: #2a8a4a;
            color: #f0fff0;
        }
        .tx-item .tx-actions .approve:hover:not(:disabled) {
            background: #3aaa5a;
            transform: scale(1.02);
        }
        .tx-item .tx-actions .reject {
            background: #8a2a2a;
            color: #fff0f0;
        }
        .tx-item .tx-actions .reject:hover:not(:disabled) {
            background: #aa3a3a;
            transform: scale(1.02);
        }
        .tx-item .tx-actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .tx-item .tx-status {
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            white-space: nowrap;
        }
        .tx-item .tx-status.pending {
            background: rgba(200, 180, 60, 0.2);
            color: #f5d76e;
        }
        .tx-item .tx-status.approved {
            background: rgba(70, 200, 120, 0.2);
            color: #7ddfa0;
        }
        .tx-item .tx-status.rejected {
            background: rgba(200, 70, 70, 0.2);
            color: #ff8a8a;
        }
        .tx-timestamp {
            font-size: 0.6rem;
            color: #4a6a8a;
            min-width: 50px;
            text-align: right;
        }

        .player-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .player-list::-webkit-scrollbar {
            width: 4px;
        }
        .player-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .player-list::-webkit-scrollbar-thumb {
            background: rgba(80, 150, 200, 0.3);
            border-radius: 10px;
        }
        .player-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .player-item .p-name {
            font-weight: 700;
            color: #f5e7c8;
        }
        .player-item .p-wallets {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
        }
        .player-item .p-wallets span {
            color: #8ab0c8;
        }
        .player-item .p-wallets .main {
            color: #f5c542;
        }
        .player-item .p-wallets .play {
            color: #7ddfa0;
        }
        .player-item .p-wallets .pending {
            color: #f5d76e;
        }

        .empty-state {
            color: #4a6a8a;
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }

        .refresh-btn {
            background: rgba(40, 80, 120, 0.3);
            border: 1px solid rgba(60, 120, 170, 0.2);
            border-radius: 30px;
            padding: 6px 16px;
            color: #8ab0c8;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: rgba(40, 80, 120, 0.5);
        }
        .refresh-btn:active {
            transform: scale(0.95);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 26, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 197, 66, 0.3);
            border-radius: 12px;
            padding: 12px 20px;
            color: #d4e6fa;
            font-size: 0.85rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            display: none;
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: #7ddfa0;
        }
        .toast.error {
            border-color: #ff6b6b;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .tx-user-select {
            background: #0a1a2a;
            border: 1px solid rgba(60, 120, 170, 0.4);
            border-radius: 16px;
            padding: 2px 8px;
            color: #e8f0f8;
            font-size: 0.7rem;
            outline: none;
            max-width: 120px;
        }
        .tx-user-select:focus {
            border-color: #f5c542;
        }
        .tx-user-input {
            background: #0a1a2a;
            border: 1px solid rgba(60, 120, 170, 0.4);
            border-radius: 16px;
            padding: 2px 8px;
            color: #e8f0f8;
            font-size: 0.7rem;
            outline: none;
            width: 100px;
        }
        .tx-user-input:focus {
            border-color: #f5c542;
        }
        .tx-actions-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .copy-btn {
            background: rgba(40, 80, 120, 0.4);
            border: none;
            border-radius: 12px;
            padding: 0 6px;
            color: #8ab0c8;
            font-size: 0.6rem;
            cursor: pointer;
        }
        .copy-btn:hover {
            background: rgba(40, 80, 120, 0.6);
        }
        .debug-btn {
            background: rgba(200, 180, 60, 0.2);
            border: 1px solid rgba(200, 180, 60, 0.3);
            border-radius: 16px;
            padding: 2px 12px;
            color: #f5d76e;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .debug-btn:hover {
            background: rgba(200, 180, 60, 0.3);
        }
        .load-users-btn {
            background: rgba(70, 200, 120, 0.2);
            border: 1px solid rgba(70, 200, 120, 0.3);
            border-radius: 16px;
            padding: 2px 12px;
            color: #7ddfa0;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .load-users-btn:hover {
            background: rgba(70, 200, 120, 0.3);
        }


        /* Authentication */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: #081522;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 45, 70, 0.96);
            border: 1px solid rgba(60, 120, 170, 0.25);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        .auth-card h2 { color:#f5e7c8; margin-bottom:8px; }
        .auth-card p { color:#8ab0c8; font-size:.85rem; margin-bottom:20px; }
        .auth-card input {
            width:100%; padding:12px 14px; margin-bottom:10px;
            background:#0a1a2a; border:1px solid rgba(60,120,170,.4);
            border-radius:12px; color:#e8f0f8; outline:none;
        }
        .auth-card input:focus { border-color:#f5c542; }
        .auth-login {
            width:100%; padding:11px; border:0; border-radius:12px;
            background:#f5c542; color:#16202a; font-weight:800; cursor:pointer;
        }
        .auth-login:disabled { opacity:.5; cursor:not-allowed; }
        .auth-error { min-height:20px; color:#ff8a8a; font-size:.78rem; margin-top:10px; }
        .role-badge {
            display:inline-block; margin-left:8px; padding:3px 9px;
            border-radius:12px; font-size:.68rem; font-weight:700;
            background:rgba(245,197,66,.15); color:#f5d76e;
        }
        .logout-btn, .clear-btn {
            background:rgba(255,107,107,.12);
            border:1px solid rgba(255,107,107,.25);
            border-radius:30px; padding:6px 14px; color:#ffaaaA;
            cursor:pointer; font-size:.8rem;
        }
        .clear-btn {
            background:rgba(245,197,66,.10);
            border-color:rgba(245,197,66,.25); color:#f5d76e;
        }
        .logout-btn:hover, .clear-btn:hover { background:rgba(255,107,107,.22); }
        .clear-btn:hover { background:rgba(245,197,66,.20); }
        .hidden { display:none !important; }
    </style>
</head>
<body>
    <div class="auth-overlay" id="authOverlay">
        <form class="auth-card" id="loginForm">
            <h2>🔐 Winzo Admin Login</h2>
            <p>Sign in with an authorized Firebase account.</p>
            <input id="loginEmail" type="email" autocomplete="username" placeholder="Admin email" required />
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required />
            <button class="auth-login" id="loginBtn" type="submit">Sign In</button>
            <div class="auth-error" id="loginError"></div>
        </form>
    </div>
    <div class="admin-container hidden" id="adminApp">
        <div class="admin-header">
            <h1><span>Winzo</span> · Admin</h1>
            <div class="status">
                <span class="dot online" id="statusDot"></span>
                <span id="adminStatus">🔐 Signing in...</span>
                <span class="role-badge hidden" id="roleBadge"></span>
                <button class="refresh-btn" id="refreshBtn">⟳ Refresh</button>
                <button class="load-users-btn" id="loadUsersBtn">👥 Load Users</button>
                <button class="debug-btn" id="debugBtn">🐛 Debug Users</button>
                <button class="clear-btn" id="clearBtn">🧹 Clear Screen</button>
                <button class="logout-btn" id="logoutBtn">↪ Logout</button>
            </div>
        </div>

        <div class="admin-grid">
            <div class="admin-card">
                <h2>📋 Transactions <span class="count" id="txCount">(0)</span></h2>
                <div class="transaction-list" id="transactionList"><div class="empty-state">No transactions</div></div>
            </div>
            <div class="admin-card">
                <h2>👥 Players <span class="count" id="playerCount">(0)</span></h2>
                <div class="player-list" id="playerList"><div class="empty-state">No players registered</div></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG – solve-527f4
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyA2VCeCTCx_NAcsxK-es1DCTmRjOD43dt4",
            authDomain: "renewed-8fe38.firebaseapp.com",
            projectId: "renewed-8fe38",
            storageBucket: "renewed-8fe38.firebasestorage.app",
            messagingSenderId: "741808375705",
            appId: "1:741808375705:web:c961f1664a0e17ad257508",
            measurementId: "G-04EW1D775E"
        };

        let database = null;
        let toastTimeout = null;
        let allUsers = {};
        let auth = null;
        let currentUser = null;
        let currentRole = null;

        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            auth = firebase.auth();
            console.log('✅ Firebase connected (solve-527f4)');
            document.getElementById('adminStatus').textContent = '🟢 Online';
            document.getElementById('statusDot').className = 'dot online';
        } catch (e) {
            console.warn('⚠️ Firebase error:', e);
            document.getElementById('adminStatus').textContent = '🔴 Offline';
            document.getElementById('statusDot').className = 'dot offline';
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ============================================================
        //  AUTHENTICATION / ROLE CHECK
        //  Firebase Authentication handles the password. The user's
        //  role is read from /admins/{uid}: { role: "admin"|"superadmin" }.
        // ============================================================
        function setAuthError(message) {
            document.getElementById('loginError').textContent = message || '';
        }

        function showAdminApp(user, role) {
            currentUser = user;
            currentRole = role;
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('adminApp').classList.remove('hidden');
            const badge = document.getElementById('roleBadge');
            badge.textContent = role === 'superadmin' ? 'SUPER ADMIN' : 'ADMIN';
            badge.classList.remove('hidden');
            document.getElementById('adminStatus').textContent =
                '🟢 ' + (user.email || 'Authorized');
            loadUsers();
        }

        function showLogin() {
            currentUser = null;
            currentRole = null;
            document.getElementById('adminApp').classList.add('hidden');
            document.getElementById('authOverlay').classList.remove('hidden');
            document.getElementById('roleBadge').classList.add('hidden');
            document.getElementById('loginPassword').value = '';
        }

        async function checkAdminRole(user) {
            if (!database || !user) throw new Error('Authentication is unavailable.');
            const snap = await database.ref('admins/' + user.uid).once('value');
            const profile = snap.val();
            if (!profile) throw new Error('This account is not authorized as an admin.');
            const role = String(profile.role || '').toLowerCase();
            if (role !== 'admin' && role !== 'superadmin') {
                throw new Error('Invalid admin role. Use admin or superadmin.');
            }
            return role;
        }

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!auth) {
                setAuthError('Firebase Authentication is unavailable.');
                return;
            }
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            setAuthError('');
            try {
                const credential = await auth.signInWithEmailAndPassword(email, password);
                const role = await checkAdminRole(credential.user);
                showAdminApp(credential.user, role);
            } catch (error) {
                console.error('❌ Admin login failed:', error);
                if (auth.currentUser) await auth.signOut().catch(() => {});
                setAuthError(error.message || 'Login failed.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        document.getElementById('logoutBtn').onclick = async () => {
            if (auth) await auth.signOut().catch(console.error);
            showLogin();
        };

        document.getElementById('clearBtn').onclick = () => {
            // Screen-only clear: Firebase data is NOT deleted.
            document.getElementById('transactionList').innerHTML =
                '<div class="empty-state">Screen cleared. Click Refresh to load transactions.</div>';
            document.getElementById('playerList').innerHTML =
                '<div class="empty-state">Screen cleared. Click Load Users to load players.</div>';
            document.getElementById('txCount').textContent = '(cleared)';
            document.getElementById('playerCount').textContent = '(cleared)';
            showToast('🧹 Screen cleared. Firebase data was not deleted.', 'success');
        };

        if (auth) {
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    showLogin();
                    return;
                }
                try {
                    const role = await checkAdminRole(user);
                    showAdminApp(user, role);
                } catch (error) {
                    console.error('❌ Admin authorization failed:', error);
                    await auth.signOut().catch(() => {});
                    setAuthError(error.message);
                    showLogin();
                }
            });
        }

        // ============================================================
        //  LOAD DATA
        // ============================================================
        function loadTransactions() {
            if (!database) return;
            const txRef = database.ref('transactions');
            txRef.orderByChild('timestamp').limitToLast(50).on('value', snapshot => {
                const data = snapshot.val();
                const list = document.getElementById('transactionList');
                const count = document.getElementById('txCount');
                if (!data) {
                    list.innerHTML = '<div class="empty-state">No transactions</div>';
                    count.textContent = '(0)';
                    return;
                }
                const entries = Object.values(data).reverse();
                const pendingCount = entries.filter(tx => tx.status === 'pending').length;
                count.textContent = `(${entries.length} · ${pendingCount} pending)`;
                let html = '';
                entries.forEach(tx => {
                    const statusClass = tx.status || 'pending';
                    const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
                    const isPending = statusClass === 'pending';
                    const timestamp = tx.timestamp ? new Date(tx.timestamp).toLocaleString() : '';
                    const username = tx.username || 'Unknown';
                    const selectId = `tx-user-select-${tx.id}`;
                    const inputId = `tx-user-input-${tx.id}`;
                    let optionsHtml = `<option value="">-- Select user --</option>`;
                    Object.keys(allUsers).forEach(u => {
                        const selected = (u === username) ? 'selected' : '';
                        optionsHtml += `<option value="${u}" ${selected}>${u}</option>`;
                    });
                    const copyBtn = `<button class="copy-btn" onclick="copyToClipboard('${username}')">📋</button>`;
                    html += `
                        <div class="tx-item ${statusClass}">
                            <div class="tx-info">
                                <div class="user">${username} ${copyBtn}</div>
                                <div class="details">${tx.type || 'Transaction'} · ${tx.amount || 0} Birr</div>
                            </div>
                            <span class="tx-status ${statusClass}">${statusLabel}</span>
                            <div class="tx-actions">
                                ${isPending ? `
                                    <div class="tx-actions-row">
                                        <select class="tx-user-select" id="${selectId}">
                                            ${optionsHtml}
                                        </select>
                                        <input type="text" class="tx-user-input" id="${inputId}" placeholder="Or type username" value="${username}">
                                        <button class="approve" data-txid="${tx.id}" onclick="approveTransaction('${tx.id}')">✅ Approve</button>
                                        <button class="reject" data-txid="${tx.id}" onclick="rejectTransaction('${tx.id}')">❌ Reject</button>
                                    </div>
                                ` : `
                                    <div class="tx-actions-row">
                                        <button class="approve" disabled>✅ Approve</button>
                                        <button class="reject" disabled>❌ Reject</button>
                                    </div>
                                `}
                            </div>
                            <div class="tx-timestamp">${timestamp}</div>
                        </div>
                    `;
                });
                list.innerHTML = html || '<div class="empty-state">No transactions</div>';
            });
        }

        function loadUsers() {
            if (!database) {
                showToast('Database not available', 'error');
                return;
            }
            const usersRef = database.ref('users');
            usersRef.once('value', snapshot => {
                const data = snapshot.val();
                allUsers = data || {};
                const list = document.getElementById('playerList');
                const count = document.getElementById('playerCount');
                if (!data) {
                    list.innerHTML = '<div class="empty-state">No players registered</div>';
                    count.textContent = '(0)';
                    console.warn('⚠️ No users found in /users path.');
                    showToast('⚠️ No users found in Firebase.', 'error');
                    return;
                }
                const entries = Object.entries(data);
                count.textContent = `(${entries.length})`;
                let html = '';
                entries.forEach(([username, userData]) => {
                    const main = userData.mainWallet || 0;
                    const play = userData.playWallet || 0;
                    const pending = userData.pendingWithdrawal || 0;
                    const copyBtn = `<button class="copy-btn" onclick="copyToClipboard('${username}')">📋</button>`;
                    html += `
                        <div class="player-item">
                            <span class="p-name">${username} ${copyBtn}</span>
                            <div class="p-wallets">
                                <span class="main">💰 ${main}</span>
                                <span class="play">🎰 ${play}</span>
                                ${pending > 0 ? `<span class="pending">⏳ ${pending}</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html || '<div class="empty-state">No players</div>';
                // Refresh transactions to update dropdowns
                loadTransactions();
                showToast(`✅ Loaded ${entries.length} users.`, 'success');
            }).catch(error => {
                console.error('❌ Failed to load users:', error);
                showToast(`❌ Error loading users: ${error.message}`, 'error');
            });
        }

        // Initial load
        function loadPlayers() {
            loadUsers(); // we just call loadUsers directly
        }

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast(`✅ Copied "${text}" to clipboard`, 'success');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(`✅ Copied "${text}" to clipboard`, 'success');
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(`✅ Copied "${text}" to clipboard`, 'success');
            }
        }

        // ============================================================
        //  CORE: Find user with case‑insensitive fallback
        // ============================================================
        function findUserByUsername(txUsername, callback) {
            const trimmed = txUsername.trim();
            if (!trimmed) return callback(null, null);

            console.log(`🔍 Searching for user: "${trimmed}"`);

            // Try direct match first
            const userRef = database.ref('users/' + trimmed);
            userRef.once('value', snapshot => {
                if (snapshot.exists()) {
                    console.log(`✅ Direct match found: "${trimmed}"`);
                    return callback(trimmed, snapshot.val());
                }

                // Not found – search all users
                const allUsersRef = database.ref('users');
                allUsersRef.once('value', allSnapshot => {
                    const allUsersData = allSnapshot.val();
                    if (!allUsersData) {
                        console.warn('❌ No users in database.');
                        return callback(null, null);
                    }

                    const keys = Object.keys(allUsersData);
                    const lower = trimmed.toLowerCase();

                    console.log('📋 All usernames:', keys);

                    // Exact case‑insensitive match
                    const exactMatch = keys.find(k => k.toLowerCase() === lower);
                    if (exactMatch) {
                        console.log(`✅ Case-insensitive match found: "${exactMatch}"`);
                        return callback(exactMatch, allUsersData[exactMatch]);
                    }

                    // Try trimming spaces
                    const trimmedMatch = keys.find(k => k.toLowerCase().trim() === lower.trim());
                    if (trimmedMatch) {
                        console.log(`✅ Trimmed match found: "${trimmedMatch}"`);
                        return callback(trimmedMatch, allUsersData[trimmedMatch]);
                    }

                    console.warn(`❌ No match found for "${trimmed}"`);
                    return callback(null, null);
                });
            });
        }

        // ============================================================
        //  APPROVE TRANSACTION – With fallback and detailed logging
        // ============================================================
        function approveTransaction(txId) {
            if (!database) {
                showToast('Database not available', 'error');
                return;
            }

            const btn = document.querySelector(`button[data-txid="${txId}"].approve`);
            if (btn) btn.disabled = true;

            const selectField = document.getElementById(`tx-user-select-${txId}`);
            const inputField = document.getElementById(`tx-user-input-${txId}`);
            let selectedUsername = '';
            if (selectField && selectField.value) {
                selectedUsername = selectField.value.trim();
            }
            if (!selectedUsername && inputField) {
                selectedUsername = inputField.value.trim();
            }

            if (!selectedUsername) {
                showToast('❌ Please select or type a username.', 'error');
                if (btn) btn.disabled = false;
                return;
            }

            console.log(`🔍 Approving ${txId} for user: "${selectedUsername}"`);

            findUserByUsername(selectedUsername, (foundUsername, userData) => {
                if (!foundUsername || !userData) {
                    console.error(`❌ User "${selectedUsername}" not found.`);
                    // Show all users in console
                    const usersRef = database.ref('users');
                    usersRef.once('value', snap => {
                        const all = snap.val();
                        console.log('📋 All registered users:', all ? Object.keys(all) : 'none');
                        showToast(`❌ User "${selectedUsername}" not found. Check console.`, 'error');
                        if (btn) btn.disabled = false;
                    });
                    return;
                }

                console.log(`✅ Found user "${foundUsername}"`);

                const txRef = database.ref('transactions/' + txId);
                txRef.once('value', txSnapshot => {
                    const txData = txSnapshot.val();
                    if (!txData) {
                        showToast('Transaction not found', 'error');
                        if (btn) btn.disabled = false;
                        return;
                    }
                    if (txData.status !== 'pending') {
                        showToast('Transaction already processed', 'error');
                        if (btn) btn.disabled = false;
                        return;
                    }

                    const amount = Number(txData.amount);
                    const type = String(txData.type || '').trim().toLowerCase();

                    if (!Number.isFinite(amount) || amount <= 0) {
                        showToast('❌ Invalid transaction amount.', 'error');
                        if (btn) btn.disabled = false;
                        return;
                    }

                    if (type !== 'deposit' && type !== 'withdraw') {
                        console.error('❌ Unsupported transaction type:', txData.type, txData);
                        showToast(`❌ Unsupported transaction type: ${txData.type || 'missing'}`, 'error');
                        if (btn) btn.disabled = false;
                        return;
                    }

                    // Update transaction username if different
                    if (foundUsername !== txData.username) {
                        txRef.update({ username: foundUsername })
                            .then(() => console.log(`✅ Transaction username updated to "${foundUsername}"`))
                            .catch(err => console.warn('Could not update username:', err));
                    }

                    // Atomically update the user's wallet.
                    // Validate the transaction before entering Firebase transaction()
                    // so an unsupported type cannot silently abort with committed=false.
                    const userRef = database.ref('users/' + foundUsername);

                    userRef.once('value').then(userSnapshot => {
                        if (!userSnapshot.exists()) {
                            throw new Error(`User "${foundUsername}" does not exist in /users.`);
                        }

                        return userRef.transaction(current => {
                            if (current === null || typeof current !== 'object') {
                                return current;
                            }

                            const updated = { ...current };

                            if (type === 'deposit') {
                                updated.playWallet = Number(updated.playWallet || 0) + amount;
                            } else {
                                updated.mainWallet = Math.max(0, Number(updated.mainWallet || 0) - amount);
                                updated.pendingWithdrawal = Math.max(0, Number(updated.pendingWithdrawal || 0) - amount);
                            }

                            return updated;
                        });
                    }).then(result => {
                        if (!result.committed) {
                            console.error('❌ Wallet transaction was not committed:', {
                                username: foundUsername,
                                type,
                                amount,
                                path: `users/${foundUsername}`
                            });
                            showToast('❌ Wallet update was not committed. Refresh and try again.', 'error');
                            if (btn) btn.disabled = false;
                            return;
                        }

                        txRef.update({ status: 'approved' })
                            .then(() => {
                                showToast(`✅ ${foundUsername} - ${type} of ${amount} Birr approved!`, 'success');
                                loadTransactions();
                                loadUsers(); // refresh users list
                            })
                            .catch(err => {
                                console.error('❌ Failed to approve transaction:', err);
                                showToast(`❌ ${err.message}`, 'error');
                                if (btn) btn.disabled = false;
                                loadTransactions();
                                loadUsers();
                            });
                    });
                });
            });
        }

        function rejectTransaction(txId) {
            if (!database) {
                showToast('Database not available', 'error');
                return;
            }

            const btn = document.querySelector(`button[data-txid="${txId}"].reject`);
            if (btn) btn.disabled = true;

            const txRef = database.ref('transactions/' + txId);
            txRef.update({ status: 'rejected' })
                .then(() => {
                    showToast('❌ Transaction rejected', 'error');
                    loadTransactions();
                    loadUsers();
                })
                .catch(err => {
                    console.error('❌ Failed to reject:', err);
                    showToast(`❌ ${err.message}`, 'error');
                    if (btn) btn.disabled = false;
                });
        }

        // ============================================================
        //  BUTTON HANDLERS
        // ============================================================
        document.getElementById('loadUsersBtn').onclick = () => {
            loadUsers();
        };

        document.getElementById('debugBtn').onclick = () => {
            if (!database) {
                showToast('Database not available', 'error');
                return;
            }
            const usersRef = database.ref('users');
            usersRef.once('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    console.log('📋 All users:', data);
                    showToast(`✅ ${Object.keys(data).length} users found. Check console.`, 'success');
                } else {
                    console.warn('❌ No users found.');
                    showToast('❌ No users found. Check Firebase permissions.', 'error');
                }
            }).catch(err => {
                console.error('❌ Debug error:', err);
                showToast(`❌ Error: ${err.message}`, 'error');
            });
        };

        // ============================================================
        //  REFRESH
        // ============================================================
        document.getElementById('refreshBtn').onclick = () => {
            if (database) {
                database.ref('transactions').off();
                database.ref('users').off();
                loadUsers();
                loadTransactions();
                document.getElementById('adminStatus').textContent = '🔄 Refreshing...';
                setTimeout(() => {
                    document.getElementById('adminStatus').textContent = '🟢 Online';
                    document.getElementById('statusDot').className = 'dot online';
                    showToast('✅ Refreshed successfully', 'success');
                }, 500);
            }
        };

        // ============================================================
        //  INIT
        // ============================================================
        if (database && auth) {
            console.log('✅ Admin server ready (authentication required)');
            console.log('ℹ️ Authorized roles: admin, superadmin');
            console.log('ℹ️ Screen Clear only clears the visible lists; it does not delete Firebase data.');
        } else {
            document.getElementById('adminStatus').textContent = '🔴 Offline - Check Firebase config';
            document.getElementById('statusDot').className = 'dot offline';
            setAuthError('Firebase is not available. Check the Firebase configuration.');
        }
    </script>
